"area\":{\"row\":[3,6],\"col\":[9,17]}},\"gridInfoPhone\":{\"area\":{\"row\":[3,8],\"col\":[1,9]}},\"propsPhone\":{\"content\":{\"0\":{\"ops\":[{\"insert\":\"*\",\"attributes\":{\"heading\":\"Heading-6\",\"align\":\"center\",\"hid\":\"MZg9mZrXlorT\",\"lmkr\":\"1\"}},{\"attributes\":{\"bold\":\"true\"},\"insert\":\"得物App空中宣讲会\"},{\"insert\":\"\\n\"}],\"zoneId\":\"0\",\"zoneType\":\"Z\"}}},\"children\":[]}]},{\"id\":\"KmXmTAWNUXyyCJfP_5\",\"type\":\"QAndA\",\"props\":{\"background\":\"color\",\"sectionTitle\":true,\"isExpandAnswers\":true,\"sectionTabs\":true,\"isShowSpecifiedNums\":true,\"dataList\":[{\"id\":\"4C5SDmTSwCFnduyj_70\",\"name1\":true,\"name\":\"简历投递\",\"qaList\":[{\"question\":\"每人可以投递几个校招职位？\",\"answer\":\"每位同学至多可投递2个不同的职位（含内推），会根据投递的先后顺序来确定第一和第二志愿，优先推进第一志愿的岗位进程；若第一志愿终止或在流程中10-20个工作日未推进，则会解锁允许推进第二志愿岗位\"},{\"question\":\"志愿可以进行更换与调整嘛？\",\"answer\":\"如果两个志愿均已投递，会按投递顺序依次计算志愿，如果两个志愿均未被处理，同学可以在得物校园招聘官网(campus.dewu.com)操作更换志愿顺序；如果其中某一个志愿已经被HR处理（官网进度流程上已显示进入下一个阶段或者点击显示你的简历已被HR处理），则无法调整；如有特殊情况（放弃第一志愿或者终止流程），同学可以联系得物校招邮箱(campus@dewu.com)反馈情况\"},{\"question\":\"候选人是否可以修改简历/手机号/邮箱？\",\"answer\":\"每位同学至多可投递2个不同的职位（含内推），如果均未投递（或已投递了一个职位），可以在投递新职位的时候进行修改简历及个人信息，如果2个志愿均已投递，是无法修改简历及个人信息的；如特殊情况，需要修改相关信息，同学可以联系得物校招邮箱(campus@dewu.com)反馈情况\"},{\"question\":\"志愿过期会有影响吗？\",\"answer\":\"系统原因需要设定志愿期限，但志愿过期不影响流程推进，如未显示“流程终止”，则仍在流程中\"},{\"question\":\"投递后发现投错职位了可以修改吗？\",\"answer\":\"职位一经投递不能更改，所以请投递前仔细查看职位JD，选择适合自己的职位\"}]},{\"id\":\"EFUbDuRd69uqWV96_71\",\"name1\":true,\"name\":\"招聘流程\",\"qaList\":[{\"question\":\"如何查询自己的投递进度？\",\"answer\":\"点击得物校园招聘官网(campus.dewu.com)右上方的头像，点击我的【投递记录】可以查看；或者关注“得物App招聘”微信公众号，导航栏-校园招聘-进度查看\"},{\"question\":\"简历投递/面试后多长时间可以收到结果？\",\"answer\":\"同学可在官网中查看自己的投递进度，如未显示“流程终止”，则仍在流程中，面试反馈一般在5个工作日内，但各职位招聘流程有所不同，可能无法给到准确答复。请同学耐心等待后续评估的邮件和短信通知\"},{\"question\":\"每个岗位都会有笔试吗？\",\"answer\":\"是的，每个志愿均需参加笔试（除设计岗位外）笔试结果会作为后续面试推进的重要依据，请按时参加\"},{\"question\":\"校招笔试形式是什么样的呢？\",\"answer\":\"得物2027届校园招聘笔试均为牛客网线上笔试（一般技术岗位为专业笔试、编程或AI Coding题，非技术岗位为测评，设计类职位无需笔试）专业笔试的同学们请在参加考试前准备好带有摄像头的电脑设备；下载谷歌最新版Chrome浏览器访问笔试网址；提前测试好网络情况避免发生闪退等现象\"},{\"question\":\"错过一次笔试，还能再参加笔试吗？\",\"answer\":\"在收到笔试通知后尽量在规定时间内按时参与；综合测评只有一次作答机会，有3个自然日的作答周期；技术类笔试如果第一次未及时参加，后续会根据岗位的实际情况来决定是否会继续推送笔试\"},{\"question\":\"第二志愿推进是否需要再次作答笔试？\",\"answer\":\"如果第二志愿和第一志愿笔试都是综合测评，则不需要，成绩共享，若是技术岗位笔试试卷不一样，则需要再次笔试\"},{\"question\":\"一共有几轮面试？ \",\"answer\":\"面试轮次一般为2-4轮，根据不同岗位会有所区分\"},{\"question\":\"接到面试邀请后，突然有其他紧急事情，需要更改面试时间，应该如何操作？\",\"answer\":\"可查看自己的邮件和短信，面试邀请中会有相应得物HR的联系方式，同学可联系HR反馈情况沟通是否可修改时间，如有疑问也可以发送邮件至campus@dewu.com\"},{\"question\":\"我关注的岗位在官网找不到了是什么原因？\",\"answer\":\"岗位投递量较大的情况下，岗位会暂停接收新简历，未投递的同学可以看看其他感兴趣的岗位，已投递的同学我们会正常推进\"}]},{\"id\":\"IlzfBjraYa1NZl7o_72\",\"name1\":true,\"name\":\"内推\",\"qaList\":[{\"question\":\"使用内推投递有什么优势吗？\",\"answer\":\"内推简历会被优先筛选，此外可通过内推人更深入地了解公司福利、培训体系、上升空间……\"},{\"question\":\"我该如何参加校招内推？\",\"answer\":\"朋友圈各大得物校园大使、在得物工作的学长学姐、学校社群、线上媒体、专业论坛仔细搜寻，捕捉得物er的身影，即可获得内推二维码（*不过要注意：在投递后暂不支持补充或修改内推码）\"},{\"question\":\"投递时显示【你近期已通过其他渠道投递过本公司，暂无法通过内推投递，请尝试其他投递渠道】，这是什么意思？\",\"answer\":\"同学的简历在其他渠道保护期内，所以无法使用内推码进行投递。但是可以不用内推码正常在官网(campus.dewu.com)投递，不影响招聘流程的推进\"}]},{\"id\":\"AyxKRsp9t6AsYKim_880\",\"name1\":true,\"name\":\"其他\",\"qaList\":[{\"question\":\"本次校招开放哪些城市？\",\"answer\":\"目前是：上海、杭州、北京、长沙、成都、贵阳、咸阳、广州、武汉、廊坊、沈阳\"},{\"question\":\"第三方渠道投递的简历进度怎么在官网上看不到呢？\",\"answer\":\"第三方渠道投递的简历暂时无法在校招官网查询进度，同学可以关注邮箱及短信通知\"}]}],\"peopleQuestion\":true,\"peopleAnswer\":true,\"_sectionTitle\":{\"caption\":{\"text\":\"校招Q/A\",\"textHeading\":\"Heading 4\",\"fontSize\":\"var(--basic-fontSize-h4)\",\"textFontFamily\":\"var(--basic-fontFamily-h)\",\"textBold\":true,\"textItalic\":false},\"titleType\":\"text\",\"titleImage\":\"https://lf3-static.bytednsdoc.com/obj/eden-cn/ryvdeh7pogupsuloj/bytedance-portal/uploader-example/upload_title_image_one_line_title.png\",\"ratio\":\"30:1\"},\"sectionAlignment\":\"center\",\"_sectionAlignment\":{},\"sectionDescription\":false,\"_sectionDescription\":{\"caption\":{\"text\":\"请添加一段描述性文字请添加一段描述性文字请添加一段描述性文字请添加一段描述性文字\",\"textHeadi
