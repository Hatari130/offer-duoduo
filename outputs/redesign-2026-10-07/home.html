<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页 · 统一风格视觉稿</title>
<style>
  :root {
    --canvas: #f6f7fb;
    --surface: #ffffff;
    --muted: #f2f4f8;
    --line: #e6e9f0;
    --line-strong: #d3d9e4;
    --ink: #161922;
    --ink-2: #4d5567;
    --ink-3: #8089a0;
    --brand: #3f56b8;
    --brand-soft: #eef1ff;
    --brand-ink: #34499f;
    --warm: #d9772b;
    --warm-soft: #fdf0e4;
    --shadow: 0 1px 2px rgb(22 25 34 / .04), 0 8px 24px -16px rgb(22 25 34 / .18);
    --shadow-lift: 0 2px 4px rgb(22 25 34 / .04), 0 18px 40px -24px rgb(22 25 34 / .35);
    --ease: cubic-bezier(.22, 1, .36, 1);
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, Georgia, serif;
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    --deck-card: clamp(9.5rem, 12.5vw, 11.25rem);
  }
  [data-theme="dark"] {
    --canvas: #0d1118;
    --surface: #141a24;
    --muted: #1a2130;
    --line: #232b3a;
    --line-strong: #2f3949;
    --ink: #eef1f7;
    --ink-2: #b3bbcc;
    --ink-3: #7c869b;
    --brand: #8ea2ff;
    --brand-soft: #1e2645;
    --brand-ink: #b9c6ff;
    --warm: #f0a25e;
    --warm-soft: #33241a;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px -16px rgb(0 0 0 / .6);
    --shadow-lift: 0 2px 4px rgb(0 0 0 / .3), 0 18px 40px -24px rgb(0 0 0 / .8);
  }
  /* Cover colours, same variables as the app. */
  .team-cover { --cover-card: #fff; display: block; width: 100%; height: 100%; }
  .team-cover[data-team="resume_coach"] { --cover-paper: #eef2ff; --cover-ink: #26324f; --cover-accent: #3f56b8; --cover-soft: #cbd4ff; }
  .team-cover[data-team="interview_coach"] { --cover-paper: #fff1ec; --cover-ink: #4a2a22; --cover-accent: #c4533b; --cover-soft: #f6c9bb; }
  .team-cover[data-team="job_radar"] { --cover-paper: #e9f6f2; --cover-ink: #1f3f38; --cover-accent: #2f7d6d; --cover-soft: #b7e0d5; }
  .team-cover[data-team="career_planner"] { --cover-paper: #fff6e3; --cover-ink: #4a3415; --cover-accent: #a8671c; --cover-soft: #f1d6a4; }
  [data-theme="dark"] .team-cover { --cover-card: #ffffff1f; }
  [data-theme="dark"] .team-cover[data-team="resume_coach"] { --cover-paper: #1a2140; --cover-ink: #dfe5ff; --cover-accent: #8ea2ff; --cover-soft: #344072; }
  [data-theme="dark"] .team-cover[data-team="interview_coach"] { --cover-paper: #2b1c18; --cover-ink: #ffe3da; --cover-accent: #f08a70; --cover-soft: #5a342a; }
  [data-theme="dark"] .team-cover[data-team="job_radar"] { --cover-paper: #122b26; --cover-ink: #d6f3ea; --cover-accent: #5cc7ae; --cover-soft: #24524a; }
  [data-theme="dark"] .team-cover[data-team="career_planner"] { --cover-paper: #2a2213; --cover-ink: #fbe9c6; --cover-accent: #e8a54b; --cover-soft: #574522; }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .frame { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

  /* ---------- 侧栏 ---------- */
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 8px; padding: 4px 10px 18px; font-weight: 700; font-size: 18px; color: var(--brand); }
  .logo i { width: 22px; height: 12px; border-bottom: 4px solid var(--brand); border-radius: 0 0 14px 14px; transform: rotate(-12deg); }
  .new-chat { display: flex; align-items: center; justify-content: space-between; height: 40px; margin-bottom: 10px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; font-weight: 500; transition: border-color .2s, box-shadow .2s; }
  .new-chat:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .new-chat kbd { color: var(--ink-3); font: 12px var(--sans); }
  .nav { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--ink-2); font-size: 14px; transition: background .15s, color .15s; }
  .nav:hover { background: var(--muted); color: var(--ink); }
  .nav.is-on { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
  .nav svg { width: 18px; height: 18px; flex: none; }
  .recent { margin-top: 22px; padding: 0 12px; }
  .recent h4 { margin: 0 0 8px; color: var(--ink-3); font-size: 12px; font-weight: 500; }
  .recent a { display: block; overflow: hidden; padding: 7px 0; color: var(--ink-2); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; border-radius: 8px; transition: color .15s; }
  .recent a:hover { color: var(--ink); }
  .me { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: 10px 12px; border-radius: 12px; font-size: 13px; }
  .me i { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: var(--brand-soft); color: var(--brand-ink); font-style: normal; font-weight: 700; }
  .me small { display: block; color: var(--ink-3); font-size: 12px; }

  /* ---------- 顶部 ---------- */
  main { position: relative; padding: 0 clamp(20px, 4vw, 56px) 64px; overflow: hidden; }
  main::before { content: ""; position: absolute; inset: -20% -10% auto; height: 520px; background: radial-gradient(40% 60% at 30% 30%, rgb(63 86 184 / .09), transparent 70%), radial-gradient(35% 50% at 75% 20%, rgb(217 119 43 / .07), transparent 70%); pointer-events: none; }
  .top { display: flex; justify-content: flex-end; gap: 8px; padding: 18px 0; position: relative; }
  .pill { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; transition: box-shadow .2s, border-color .2s; }
  .pill:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
  .wrap { position: relative; max-width: 880px; margin: 0 auto; }

  .hero { text-align: center; padding-top: 28px; }
  h1 { margin: 0; font-family: var(--serif); font-size: clamp(30px, 3.4vw, 42px); font-weight: 700; letter-spacing: .01em; }
  .hero p { margin: 12px 0 0; color: var(--ink-2); font-size: 15px; }

  /* ---------- 团队卡片：扇形叠放 ---------- */
  .deck { position: relative; height: calc(var(--deck-card) * 1.7); margin: 8px 0 0; }
  .card { --shift: 0px; position: absolute; z-index: var(--z); top: 50%; left: 50%; width: var(--deck-card); height: var(--deck-card); border-radius: 14px; box-shadow: 0 10px 22px -16px rgb(17 28 48 / .35);
    transform: translate(-50%, -50%) translateX(calc(var(--x) + var(--shift))) translateY(var(--y)) rotate(var(--r));
    transition: transform .38s var(--ease), width .38s var(--ease), height .38s var(--ease), border-radius .32s, background-color .2s, box-shadow .32s; opacity: 0; animation: deal .6s var(--ease) forwards; animation-delay: var(--d); }
  @keyframes deal { from { opacity: 0; transform: translate(-50%, -40%) translateX(0) rotate(0) scale(.9); } to { opacity: 1; } }
  .card[data-p="before"] { --shift: -2.6rem; }
  .card[data-p="after"] { --shift: 2.6rem; }
  .card[data-p="self"] { z-index: 20; width: calc(var(--deck-card) * 1.14); height: calc(var(--deck-card) * 1.44); border-radius: 18px; background: var(--surface); box-shadow: 0 26px 56px -28px rgb(17 28 48 / .5);
    transform: translate(-50%, -50%) translateX(var(--x)) translateY(calc(var(--y) - 4px)) rotate(0) scale(1.08); }
  .cover { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; transition: inset .38s var(--ease), border-radius .32s; }
  .card[data-p="self"] .cover { inset: 9px 9px 58px; border-radius: 11px; }
  .badge { position: absolute; z-index: 3; bottom: 8px; left: 8px; display: none; padding: 2px 8px; border-radius: 99px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 600; }
  [data-theme="dark"] .badge { color: #0d1118; }
  .card.is-invited .badge { display: block; }
  .card.is-invited:not([data-p="self"]) { box-shadow: 0 0 0 2px var(--brand), 0 10px 22px -16px rgb(17 28 48 / .35); }
  .details { position: absolute; left: 11px; right: 11px; bottom: 9px; height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 8px; opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .16s, transform .22s var(--ease); }
  .card[data-p="self"] .details { opacity: 1; transform: none; pointer-events: auto; transition: opacity .22s .08s, transform .3s var(--ease) .05s; }
  .details strong { display: block; font-size: 13px; font-weight: 600; }
  .faces { display: flex; margin-top: 3px; }
  .faces svg { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--surface); }
  .faces svg + svg { margin-left: -5px; }
  .invite { height: 28px; padding: 0 13px; border-radius: 99px; background: var(--ink); color: var(--surface); font-size: 12px; font-weight: 600; transition: transform .18s var(--ease), opacity .18s; }
  .invite:hover { transform: translateY(-1px); opacity: .85; }

  /* ---------- 输入框 ---------- */
  .composer { position: relative; z-index: 2; padding: 14px 14px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); transition: border-color .3s, box-shadow .3s var(--ease); }
  .composer:focus-within { border-color: var(--line-strong); box-shadow: 0 0 0 4px var(--brand-soft), var(--shadow-lift); }
  .chip-team { display: none; align-items: center; gap: 8px; width: fit-content; margin: 0 0 6px 2px; padding: 4px 10px 4px 5px; border-radius: 99px; background: var(--brand-soft); color: var(--brand-ink); font-size: 13px; }
  .chip-team.is-on { display: inline-flex; animation: pop .45s var(--ease); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.94); } to { opacity: 1; transform: none; } }
  .chip-team .faces { margin: 0; }
  .chip-team .faces svg { width: 22px; height: 22px; box-shadow: 0 0 0 1.5px var(--brand-soft); }
  .chip-team span { color: var(--ink-3); font-size: 12px; }
  .chip-team button { width: 18px; height: 18px; border-radius: 50%; color: var(--ink-3); font-size: 12px; }
  textarea { display: block; width: 100%; min-height: 64px; padding: 6px 6px 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: 15px/1.6 var(--sans); }
  textarea::placeholder { color: var(--ink-3); }
  .tools { display: flex; align-items: center; gap: 4px; }
  .tool { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 10px; color: var(--ink-2); font-size: 13px; transition: background .15s, color .15s; }
  .tool:hover { background: var(--muted); color: var(--ink); }
  .tool svg { width: 16px; height: 16px; }
  .send { width: 36px; height: 36px; margin-left: auto; display: grid; place-items: center; border-radius: 50%; background: var(--muted); color: var(--ink-3); transition: background .2s, color .2s, transform .2s var(--ease); }
  .send.is-ready { background: var(--brand); color: #fff; }
  [data-theme="dark"] .send.is-ready { color: #0d1118; }
  .send.is-ready:hover { transform: translateY(-1px); }

  /* ---------- 今天 ---------- */
  .today { margin-top: 34px; }
  .today h2 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 12px; font-family: var(--serif); font-size: 18px; }
  .today h2 small { color: var(--ink-3); font-family: var(--sans); font-size: 12px; font-weight: 400; }
  .brief { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .item { display: flex; flex-direction: column; gap: 10px; padding: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; opacity: 0; animation: rise .5s var(--ease) forwards; transition: border-color .2s, box-shadow .3s var(--ease), transform .3s var(--ease); }
  .item:hover { border-color: var(--line-strong); box-shadow: var(--shadow-lift); transform: translateY(-2px); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .item header { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 12px; }
  .item header svg { width: 22px; height: 22px; border-radius: 50%; }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 0 4px var(--warm-soft); margin: 0 4px 0 6px; }
  .item b { font-size: 15px; font-weight: 600; line-height: 1.4; }
  .item p { margin: 0; color: var(--ink-2); font-size: 13px; line-height: 1.55; }
  .item .go { margin-top: auto; color: var(--brand-ink); font-size: 13px; font-weight: 500; opacity: .0; transform: translateX(-4px); transition: opacity .2s, transform .3s var(--ease); }
  .item:hover .go { opacity: 1; transform: none; }
  .foot { margin-top: 26px; text-align: center; color: var(--ink-3); font-size: 12px; }

  @media (max-width: 900px) {
    .frame { grid-template-columns: 1fr; }
    .side { display: none; }
    :root { --deck-card: min(26vw, 7.2rem); }
    .card[data-p="before"] { --shift: -1.4rem; }
    .card[data-p="after"] { --shift: 1.4rem; }
    .brief { grid-template-columns: 1fr; }
    .tool { padding: 0 7px; font-size: 12px; }
    .item .go { opacity: 1; transform: none; }
    .top .pill:not(.theme) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
    .card, .item { opacity: 1; }
  }
</style>
</head>
<body>
<div class="frame">
  <aside class="side">
    <div class="logo"><i></i>JobKoI</div>
    <button class="new-chat" type="button">＋ 新对话 <kbd>⌘K</kbd></button>
    <a class="nav is-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>求职陪跑</a>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>校招信息速递</a>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 20V8l7-4 7 4v12M9 20v-6h6v6"/></svg>公司投递直达</a>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>简历模板</a>
    <a class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/></svg>个人投递管理</a>
    <div class="recent">
      <h4>最近对话</h4>
      <a>帮我把简历针对美团产品岗改一下</a>
      <a>模拟一场小红书运营的面试</a>
      <a>上海 2027 届产品岗还有哪些能投</a>
    </div>
    <div class="me"><i>陈</i><div>陈同学<small>2027 届 · 已投 42 个</small></div></div>
  </aside>

  <main>
    <div class="top">
      <button class="pill" type="button">共建反馈</button>
      <button class="pill theme" id="theme" type="button">深色</button>
    </div>
    <div class="wrap">
      <section class="hero">
        <h1>说出你的目标，求职团队和你一起推进</h1>
        <p>邀请一支团队，再用技能市场里的专家升级他们。</p>
      </section>

      <section class="deck" id="deck" aria-label="邀请一支团队"></section>

      <div class="composer">
        <div class="chip-team" id="chip">
          <span class="faces" id="chipFaces"></span>
          <strong id="chipName"></strong><span id="chipCount"></span>
          <button type="button" id="leave" aria-label="不邀请">✕</button>
        </div>
        <textarea id="box" placeholder="说说你想推进什么，也可以粘贴岗位描述或截图。"></textarea>
        <div class="tools">
          <button class="tool" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg>上传文件</button>
          <button class="tool" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>选择已有材料</button>
          <button class="tool" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h16l-1.5-5h-13zM5 10v9h14v-9M9 19v-5h6v5"/></svg>技能</button>
          <button class="send" id="send" type="button" aria-label="发送"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>

      <section class="today">
        <h2>今天 <small>10 月 7 日 · 根据你的投递和简历整理</small></h2>
        <div class="brief">
          <button class="item" type="button" style="animation-delay:.35s">
            <header><span class="dot"></span>快截止</header>
            <b>美团、小红书的投递 3 天内截止</b>
            <p>美团产品经理 10 月 9 日、小红书社区运营 10 月 10 日，都还没投。</p>
            <span class="go">去投递 →</span>
          </button>
          <button class="item" type="button" style="animation-delay:.42s">
            <header><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><clipPath id=":R0:"><circle cx="24" cy="24" r="24"></circle></clipPath><g clip-path="url(#:R0:)"><rect width="48" height="48" fill="#e6f6ec"></rect><g transform="translate(24 28) scale(1.18) translate(-24 -28)"><g stroke="#b07a4f" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M17.5 14.5 L14.6 7.8 M15.8 10.6 L12 9.6 M15.1 9.2 L16.8 6"></path><path d="M30.5 14.5 L33.4 7.8 M32.2 10.6 L36 9.6 M32.9 9.2 L31.2 6"></path></g><rect x="21" y="30" width="6" height="6" rx="2" fill="#ffe1c8"></rect><path d="M6 48 C7 38.5 14 34.4 24 34.4 C34 34.4 41 38.5 42 48Z" fill="#6cc39a"></path><ellipse cx="13.4" cy="25.6" rx="2" ry="2.6" fill="#ffe1c8"></ellipse><ellipse cx="34.6" cy="25.6" rx="2" ry="2.6" fill="#ffe1c8"></ellipse><circle cx="24" cy="24.6" r="10.6" fill="#ffe1c8"></circle><circle cx="17.6" cy="29" r="1.8" fill="#ff8a8a" opacity="0.35"></circle><circle cx="30.4" cy="29" r="1.8" fill="#ff8a8a" opacity="0.35"></circle><ellipse cx="20" cy="25.8" rx="1.35" ry="1.7" fill="#2a2320"></ellipse><ellipse cx="28" cy="25.8" rx="1.35" ry="1.7" fill="#2a2320"></ellipse><circle cx="20.45" cy="25.2" r="0.45" fill="#fff"></circle><circle cx="28.45" cy="25.2" r="0.45" fill="#fff"></circle><path d="M21.8 29.6 Q24 31.6 26.2 29.6" fill="none" stroke="#2a2320" stroke-width="1.1" stroke-linecap="round"></path><path d="M13.4 24 C12.5 15.5 18 12.2 24 12.2 C30 12.2 35.5 15.5 34.6 24 C33.8 21.6 32.4 20 30.6 19.8 C29.6 21 27.6 21.2 26.4 19.9 C25.2 21.2 22.8 21.2 21.6 19.9 C20.4 21.2 18.4 21 17.4 19.8 C15.6 20 14.2 21.6 13.4 24Z" fill="#a0643c"></path><ellipse cx="12.2" cy="19.6" rx="3.2" ry="1.7" fill="#c98b5e" transform="rotate(-28 12.2 19.6)"></ellipse><ellipse cx="35.8" cy="19.6" rx="3.2" ry="1.7" fill="#c98b5e" transform="rotate(28 35.8 19.6)"></ellipse></g></g></svg>岗位雷达</header>
            <b>新找到 6 个和你匹配的岗位</b>
            <p>上海 · 产品方向 · 2027 届，其中 2 个是本周新开放的。</p>
            <span class="go">看看是哪 6 个 →</span>

<script>
  const teams = [
    { id: "resume_coach", name: "简历精修团队", members: ["hr-screener", "business-interviewer", "plain-editor", "star-digger"], starter: "帮我把简历针对这个岗位改一下" },
    { id: "interview_coach", name: "面试陪练团队", members: ["business-interviewer", "answer-coach", "hr-screener", "group-interview"], starter: "我们来模拟一场这个岗位的面试吧" },
    { id: "job_radar", name: "岗位雷达团队", members: ["job-analyst", "soe-hr", "funnel-analyst"], starter: "帮我找几个现在还能投、适合我的岗位" },
    { id: "career_planner", name: "求职规划团队", members: ["career-planner", "funnel-analyst", "senior-peer"], starter: "帮我看看现在的投递情况，排一下这周的计划" }
  ];
  const tilts = [5, -4, 3, -4], lifts = [6, -4, 4, -6];
  const cover = (id) => document.getElementById("covers").content.querySelector(`[data-team="${id}"]`).innerHTML;
  const face = (id) => document.getElementById("faces").content.querySelector(`[data-id="${id}"]`).innerHTML;
  const deck = document.getElementById("deck");
  deck.innerHTML = teams.map((t, i) => `
    <article class="card" data-i="${i}" style="--x:${(i - 1.5) * 78}%;--y:${lifts[i]}px;--r:${tilts[i]}deg;--z:${i + 1};--d:${80 + i * 70}ms">
      <div class="cover">${cover(t.id)}</div>
      <span class="badge">✓ 已邀请</span>
      <div class="details">
        <div><strong>${t.name.replace("团队", "")}</strong><span class="faces">${t.members.map(face).join("")}</span></div>
        <button class="invite" type="button" data-team="${i}">邀请</button>
      </div>
    </article>`).join("");

  const cards = [...deck.querySelectorAll(".card")];
  const hover = (index) => cards.forEach((card, i) => {
    if (index === undefined) card.removeAttribute("data-p");
    else card.dataset.p = i === index ? "self" : i < index ? "before" : "after";
  });
  cards.forEach((card, i) => card.addEventListener("mouseenter", () => hover(i)));
  deck.addEventListener("mouseleave", () => hover());
  // The deal-in animation would fight the hover transform; drop it once it has played.
  cards.forEach((card) => card.addEventListener("animationend", () => { card.style.animation = "none"; card.style.opacity = 1; }));

  const chip = document.getElementById("chip");
  const box = document.getElementById("box");
  const send = document.getElementById("send");
  const ready = () => send.classList.toggle("is-ready", box.value.trim().length > 0);
  box.addEventListener("input", ready);
  deck.addEventListener("click", (event) => {
    const button = event.target.closest(".invite");
    if (!button) return;
    const team = teams[Number(button.dataset.team)];
    cards.forEach((card, i) => card.classList.toggle("is-invited", teams[i] === team));
    document.getElementById("chipFaces").innerHTML = team.members.map(face).join("");
    document.getElementById("chipName").textContent = team.name;
    document.getElementById("chipCount").textContent = `${team.members.length} 位专家为你工作`;
    chip.classList.remove("is-on"); void chip.offsetWidth; chip.classList.add("is-on");
    box.value = team.starter; ready(); box.focus();
  });
  document.getElementById("leave").addEventListener("click", () => {
    chip.classList.remove("is-on");
    cards.forEach((card) => card.classList.remove("is-invited"));
  });

  const toggle = document.getElementById("theme");
  toggle.addEventListener("click", () => {
    const dark = document.documentElement.dataset.theme !== "dark";
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    toggle.textContent = dark ? "浅色" : "深色";
  });
</script>
</body>
</html>
