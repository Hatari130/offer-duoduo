services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: offerflow
      POSTGRES_USER: offerflow
      POSTGRES_PASSWORD: offerflow-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - offerflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerflow -d offerflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  offerflow-postgres:
