// Reuse the existing company objects so logos, aliases and recruitment links remain unchanged.
const COMPANY_BY_NAME = new Map();
DATA.companies.forEach(category => category.companies.forEach(company => {
  if (!COMPANY_BY_NAME.has(company.n)) COMPANY_BY_NAME.set(company.n, company);
}));
SUPPLEMENTAL_COMPANIES.forEach(company => {
  if (!COMPANY_BY_NAME.has(company.n)) COMPANY_BY_NAME.set(company.n, company);
});
const sortRecruitingFirst = companies => companies
  .map((company, index) => ({company, index}))
  .sort((a, b) => {
    const aActive = DATA.recruit[a.company.n] && DATA.recruit[a.company.n].count > 0 ? 1 : 0;
    const bActive = DATA.recruit[b.company.n] && DATA.recruit[b.company.n].count > 0 ? 1 : 0;
    return bActive - aActive || a.index - b.index;
  })
  .map(item => item.company);
const cleanCategoryName = name => name.replace(/^[A-Z]\s+/, '');
const cleanGroupName = name => name.replace(/^(?:C\d+(?:\/\d+)?|\d+)\s+/, '');
DATA.companies = GOVERNMENT_CLASSIFICATION.map(category => {
  const sourceCompanies = category.companies.map(name => COMPANY_BY_NAME.get(name)).filter(Boolean);
  let groupStart = 0;
  const groups = (category.groups || []).map(group => {
    const groupSourceCompanies = sourceCompanies.slice(groupStart, groupStart + group.count);
    groupStart += group.count;
    let subgroupStart = 0;
    const subgroups = (group.subgroups || []).map(subgroup => {
      const subgroupCompanies = sortRecruitingFirst(groupSourceCompanies.slice(subgroupStart, subgroupStart + subgroup.count));
      subgroupStart += subgroup.count;
      return {name: subgroup.name, companies: subgroupCompanies};
    });
    const groupCompanies = subgroups.length
      ? subgroups.flatMap(subgroup => subgroup.companies)
      : sortRecruitingFirst(groupSourceCompanies);
    return {name: cleanGroupName(group.name), companies: groupCompanies, subgroups};
  });
  const companies = groups.length
    ? groups.flatMap(group => group.companies)
    : sortRecruitingFirst(sourceCompanies);
  return {
    cat: cleanCategoryName(category.cat),
    icon: category.icon,
    color: category.color,
    companies,
    groups
  };
});

const UNMATCHED_BY_NAME = new Map(DATA.unmatchedTop.map(item => [item.n, item]));
const SUPPLEMENTAL_RECRUIT = Object.fromEntries(SUPPLEMENTAL_COMPANIES
  .filter(company => UNMATCHED_BY_NAME.has(company.n))
  .map(company => [company.n, {count:UNMATCHED_BY_NAME.get(company.n).c, types:{}, latest:'', url:'', unmatched:true}]));
const supplementalCategoryMap = new Map(DATA.companies.map(category => [category.cat, category]));
SUPPLEMENTAL_COMPANIES.forEach(company => {
  const category = supplementalCategoryMap.get(company.category);
  if (!category || category.companies.some(item => item.n === company.n)) return;
  category.companies.push(company);
  if (!company.group) return;
  const group = category.groups.find(item => item.name === company.group);
  if (!group) return;
  group.companies.push(company);
  if (!company.subgroup) return;
  const subgroup = group.subgroups.find(item => item.name === company.subgroup);
  if (subgroup) subgroup.companies.push(company);
});

});

const $ = selector => document.querySelector(selector);
const root = $('#root');
const state = {view:'hiring', type:'all', query:'', expanded:new Set()};
const PREVIEW_LIMIT = 9;

const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
})[character]);
const getRecruit = company => DATA.recruit[company.recruitKey || company.n] || SUPPLEMENTAL_RECRUIT[company.n] || {count:0, types:{}, latest:'', url:''};
const isActive = company => getRecruit(company).count > 0;
const activeCount = companies => companies.reduce((count, company) => count + (isActive(company) ? 1 : 0), 0);
const normalized = value => String(value || '').toLocaleLowerCase('zh-CN').replace(/\s+/g, '');
const companySearchText = company => normalized([company.n, company.l, ...(company.al || [])].join(' '));
const formatDate = value => {
  if (!value) return '';
  const date = new Date(value + 'T00:00:00');
  return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString('zh-CN', {month:'numeric', day:'numeric'});
};
const formatUpdated = value => {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? value : date.toLocaleString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
};
const typeMatches = recruit => {
  if (state.type === 'all') return true;
  return Object.keys(recruit.types || {}).some(type => type.includes(state.type));
};
const companyMatches = company => {
  const recruit = getRecruit(company);
  if (state.view === 'hiring' && recruit.count <= 0) return false;
  if (!typeMatches(recruit)) return false;
  return !state.query || companySearchText(company).includes(normalized(state.query));
};
const recruitmentTime = company => {
  const latest = getRecruit(company).latest;
  if (!latest) return -Infinity;
  const time = Date.parse(latest + 'T00:00:00');
  return Number.isNaN(time) ? -Infinity : time;
};
const sortByRecruitmentFreshness = companies => companies
  .map((company, index) => ({company, index}))
  .sort((a, b) => Number(isActive(b.company)) - Number(isActive(a.company)) || a.index - b.index)
  .sort((a, b) => recruitmentTime(b.company) - recruitmentTime(a.company) || Number(isActive(b.company)) - Number(isActive(a.company)) || getRecruit(b.company).count - getRecruit(a.company).count || a.index - b.index)
  .map(item => item.company);
const countLabel = companies => {
  const hot = activeCount(companies);
  if (state.query || state.type !== 'all') return companies.length + ' 家符合条件';
  return hot + ' / ' + companies.length + ' 家招聘中';
};

const allCompanies = DATA.companies.flatMap(category => category.companies);
const FEATURED_ORDER = [
  {key:'字节跳动', label:'字节跳动'},
  {key:'大疆 DJI', label:'大疆'},
  {key:'小红书', label:'小红书'},
  {key:'腾讯', label:'腾讯'},
  {key:'美团', label:'美团'},
  {key:'蚂蚁集团', label:'蚂蚁集团'},
  {key:'滴滴', label:'滴滴'},
  {key:'快手', label:'快手'},
  {key:'京东', label:'京东'},
  {key:'阿里云', label:'阿里云'},
  {key:'阿里巴巴', label:'阿里巴巴'},
  {key:'网易', label:'网易'},
  {key:'科大讯飞', label:'科大讯飞'},
  {key:'百度', label:'百度'},
  {key:'MiniMax', label:'MiniMax'},
];
const FEATURED_COMPANIES = FEATURED_ORDER
  .map(item => ({...item, company:COMPANY_BY_NAME.get(item.key)}))
  .filter(item => item.company);
let hiringCompanies = allCompanies.filter(isActive);
let totalItems = allCompanies.reduce((total, company) => total + getRecruit(company).count, 0);
const API_URL = 'https://shouna12358-png.github.io/campus-hiring/campus-hiring.json';
const API_TYPE_LABELS = ['秋招提前批','春招补录','日常实习','实习','秋招','春招','夏招','校招'];
const API_STATE = {loaded:false, updatedAt:'', items:0, unmatched:[], error:''};
const API_MANUAL_ALIASES = new Map([
  ['东莞新能德科技有限公司','新能德'], ['北京润科通用技术有限公司','北京润科'], ['Sharpa Robotics','Sharpa'],
  ['湖南广播影视集团','湖南广电'], ['阳光保险集团','阳光保险'], ['Ubiquant','九坤投资']
]);
const pageAliases = new Map();
allCompanies.forEach(company => [company.n, company.l, ...(company.al || [])].forEach(alias => {
  const key = normalized(alias);
  if (!pageAliases.has(key)) pageAliases.set(key, company.n);
}));
const resolveApiCompany = name => pageAliases.get(normalized(name)) || API_MANUAL_ALIASES.get(name) || '';
const extractApiTypes = value => API_TYPE_LABELS.filter(type => String(value || '').includes(type));

function updateDataNote(){
  const rows = API_STATE.loaded
    ? API_STATE.unmatched.slice(0, 40)
    : DATA.unmatchedTop.filter(item => !SUPPLEMENTAL_RECRUIT[item.n]);
  const sourceCopy = API_STATE.loaded
    ? '已同步招聘信息接口：' + API_STATE.items + ' 条，接口更新时间 ' + formatUpdated(API_STATE.updatedAt) + '。'
    : '当前使用页面内置数据快照，正在尝试同步招聘信息接口。';
  $('#unmatchedList').innerHTML =
    '<p class="data-copy">' + sourceCopy + ' 页面收录名单严格对应政府分类 Word，共 ' + allCompanies.length + ' 家企业；已筛入 ' + SUPPLEMENTAL_COMPANIES.length + ' 家分类明确企业。下列企业仍未纳入本页，待补充分类或企业核验。数据源：<a href="' + API_URL + '" target="_blank" rel="noopener noreferrer">campus-hiring.json</a></p>' +
    rows.map(item => '<span class="tag">' + escapeHtml(item.n) + ' ×' + item.c + '</span>').join('');
}

function updateStats(){
  hiringCompanies = allCompanies.filter(isActive);
  totalItems = allCompanies.reduce((total, company) => total + getRecruit(company).count, 0);
  [['#statCompanies', allCompanies.length], ['#statHiring', hiringCompanies.length], ['#statItems', totalItems]].forEach(([selector, value]) => {
    const node = $(selector);
    if (node) node.textContent = value;
  });
  const updatedNode = $('#updatedAt');
  if (updatedNode) updatedNode.textContent = API_STATE.loaded
    ? '招聘接口同步：' + formatUpdated(API_STATE.updatedAt) + ' · ' + API_STATE.items + ' 条'
    : '内置数据更新：' + formatUpdated(DATA.updated);
  updateDataNote();
}

function applyApiPayload(payload){
  const records = new Map();
  const unmatched = new Map();
  for (const item of Array.isArray(payload.items) ? payload.items : []) {
    const companyName = resolveApiCompany(item.company);
    if (!companyName) {
      unmatched.set(item.company, (unmatched.get(item.company) || 0) + 1);
      continue;
    }
    const row = records.get(companyName) || {count:0, types:{}, latest:'', url:'', source:'api'};
    row.count++;
    const itemDate = String(item.updatedAt || '');
    if (itemDate > row.latest) {
      row.latest = itemDate;
      row.url = item.applyUrl || item.announcementUrl || row.url;
    }
    extractApiTypes(item.type).forEach(type => { row.types[type] = (row.types[type] || 0) + 1; });
    records.set(companyName, row);
  }
  records.forEach((row, companyName) => { DATA.recruit[companyName] = row; });
  API_STATE.loaded = true;
  API_STATE.updatedAt = payload.updatedAt || '';
  API_STATE.items = Array.isArray(payload.items) ? payload.items.length : records.size;
  API_STATE.unmatched = [...unmatched.entries()]
    .map(([n,c]) => ({n,c}))
    .sort((a,b) => b.c - a.c || a.n.localeCompare(b.n, 'zh-CN'));
  API_STATE.error = '';
  updateStats();
  render();
}

async function syncRecruitmentSource(){
  try {
    const response = await fetch(API_URL, {cache:'no-store'});
    if (!response.ok) throw new Error('HTTP ' + response.status);
    applyApiPayload(await response.json());
  } catch (error) {
    API_STATE.error = String(error && error.message || error);
    updateStats();
  }
}

updateStats();

function renderCard(company, options = {}){
  const recruit = getRecruit(company);
  const active = recruit.count > 0;
  const displayName = options.displayName || company.n;
  const domain = LOGO_DOMAINS[company.n] || DATA.domains[company.n] || '';
  const logoSource = LOGO_SOURCES[company.n] || (domain ? 'https://logos.hunter.io/' + domain : '');
  const fallbackLabel = Array.from((displayName || company.l || '?').trim())[0] || '?';
  const logoImg = logoSource
    ? '<img class="lg" alt="" width="128" height="128" decoding="async" referrerpolicy="no-referrer" src="' + escapeHtml(logoSource) + '">'
    : '';
  const types = Object.keys(recruit.types || {});
  const badges = active
    ? (types.length
      ? types.slice(0, 2).map(type => '<span class="badge">' + escapeHtml(type) + '</span>').join('')
      : '<span class="badge pending">' + (recruit.source === 'api' ? '类型待补充' : '招聘信息待补充') + '</span>')
    : '';
  const latest = formatDate(recruit.latest);
  const status = active
    ? '<div class="status hiring"><span class="status-dot"></span><span>' + recruit.count + ' 条' + (latest ? ' · 更新 ' + latest : recruit.source === 'api' ? ' · 类型待补充' : recruit.unmatched ? ' · 招聘信息待补充' : '') + '</span></div>'
    : '<div class="status"><span class="status-dot"></span><span>暂无投递</span></div>';
  const content =
    '<div class="logo">' + logoImg + '<span class="lt" aria-hidden="true">' + escapeHtml(fallbackLabel) + '</span></div>' +
    '<div class="info">' +
      '<div class="card-top"><div class="nm">' + escapeHtml(displayName) + '</div>' + (active && recruit.url ? '<div class="arr" aria-hidden="true">↗</div>' : '') + '</div>' +
      '<div class="badges">' + badges + '</div>' +
      status +
    '</div>';
  if (active && recruit.url) {
    return '<a class="card" href="' + escapeHtml(recruit.url) + '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(displayName) + '，查看招聘信息">' + content + '</a>';
  }
  return '<article class="card' + (active ? '' : ' dim') + '">' + content + '</article>';
}

function renderFeaturedSection(){
  return '<section class="category featured" aria-label="知名企业招聘">' +
    '<div class="grid">' + FEATURED_COMPANIES.map(item => renderCard(item.company, {displayName:item.label})).join('') + '</div>' +
  '</section>';
}

function renderFlatCategory(category, categoryIndex){
  const matches = sortByRecruitmentFreshness(category.companies.filter(companyMatches));
  if (!matches.length) return '';
  const groupLevelOnly = category.cat === '制造业' || category.cat === '信息传输、软件和信息技术服务业';
  if (groupLevelOnly && category.groups.length) {
    const groupSections = category.groups.map((group, groupIndex) => renderFlatGroup(group, categoryIndex, groupIndex)).join('');
    return '<section class="category" id="industry-' + categoryIndex + '">' +
      '<div class="ch"><h2 class="tt">' + escapeHtml(category.cat) + '</h2><div class="cc">' + countLabel(matches) + '</div></div>' +
      '<div class="microgroups flat-groups">' + groupSections + '</div>' +
    '</section>';
  }
  const key = state.view + '-' + categoryIndex;
  const shouldLimit = !state.query && state.type === 'all' && !state.expanded.has(key);
  const visible = shouldLimit ? matches.slice(0, PREVIEW_LIMIT) : matches;
  const remaining = matches.length - visible.length;
  return '<section class="category" id="industry-' + categoryIndex + '">' +
    '<div class="ch"><h2 class="tt">' + escapeHtml(category.cat) + '</h2><div class="cc">' + countLabel(matches) + '</div></div>' +
    '<div class="grid">' + visible.map(renderCard).join('') + '</div>' +
    (remaining > 0 ? '<div class="more-wrap"><button class="more-btn" type="button" data-expand="' + key + '">查看其余 ' + remaining + ' 家企业</button></div>' : '') +
  '</section>';
}

function renderFlatGroup(group, categoryIndex, groupIndex){
  const matches = sortByRecruitmentFreshness(group.companies.filter(companyMatches));
  if (!matches.length) return '';
  const key = 'group-' + categoryIndex + '-' + groupIndex;
  const shouldLimit = !state.query && state.type === 'all' && !state.expanded.has(key);
  const visible = shouldLimit ? matches.slice(0, 6) : matches;
  const remaining = matches.length - visible.length;
  return '<section class="microgroup group-section">' +
    '<div class="mg-head"><h3 class="mg-title">' + escapeHtml(group.name) + '</h3><div class="mg-count">' + countLabel(matches) + '</div></div>' +
    '<div class="grid">' + visible.map(renderCard).join('') + '</div>' +
    (remaining > 0 ? '<div class="more-wrap"><button class="more-btn" type="button" data-expand="' + key + '">查看本类其余 ' + remaining + ' 家</button></div>' : '') +
  '</section>';
}

function renderMicrogroup(subgroup){
  const companies = sortByRecruitmentFreshness(subgroup.companies.filter(companyMatches));
  if (!companies.length) return '';
  return '<section class="microgroup">' +
    '<div class="mg-head"><h4 class="mg-title">' + escapeHtml(subgroup.name) + '</h4><div class="mg-count">' + countLabel(companies) + '</div></div>' +
    '<div class="grid">' + companies.map(renderCard).join('') + '</div>' +
  '</section>';
}

function renderTaxonomyGroup(group, groupLevelOnly = false){
  const groupCompanies = sortByRecruitmentFreshness(group.companies.filter(companyMatches));
  if (!groupCompanies.length) return '';
  const filtered = state.query || state.type !== 'all';
  const body = !groupLevelOnly && group.subgroups.length
    ? '<div class="microgroups">' + group.subgroups.map(renderMicrogroup).join('') + '</div>'
    : '<div class="microgroups"><div class="grid">' + groupCompanies.map(renderCard).join('') + '</div></div>';
  return '<details class="taxonomy-group"' + (filtered ? ' open' : '') + '>' +
    '<summary><h3 class="sg-title">' + escapeHtml(group.name) + '</h3><span class="sg-count">' + countLabel(groupCompanies) + '</span></summary>' +
    body +
  '</details>';
}

function renderLandscapeCategory(category, categoryIndex){
  const matches = sortByRecruitmentFreshness(category.companies.filter(companyMatches));
  if (!matches.length) return '';
  const groupLevelOnly = category.cat === '制造业' || category.cat === '信息传输、软件和信息技术服务业';
  const body = category.groups.length
    ? '<div class="taxonomy">' + category.groups.map(group => renderTaxonomyGroup(group, groupLevelOnly)).join('') + '</div>'
    : '<div class="grid">' + matches.map(renderCard).join('') + '</div>';
  return '<section class="category" id="industry-' + categoryIndex + '">' +
    '<div class="ch"><h2 class="tt">' + escapeHtml(category.cat) + '</h2><div class="cc">' + countLabel(matches) + '</div></div>' +
    body +
  '</section>';
}

function visibleCategories(){
  const categories = DATA.companies.map((category, index) => ({category, index, matches:category.companies.filter(companyMatches)}))
    .filter(item => item.matches.length);
  categories.sort((a, b) => b.category.companies.length - a.category.companies.length || b.matches.length - a.matches.length || a.index - b.index);
  return categories;
}

function hydrateLogos(){
  root.querySelectorAll('.lg').forEach(logo => {
    const showLogo = () => {
      logo.classList.add('loaded');
      logo.parentNode.classList.add('has-image');
    };
    const useFallback = () => logo.remove();
    logo.addEventListener('load', showLogo, {once:true});
    logo.addEventListener('error', useFallback, {once:true});
    if (logo.complete) {
      if (logo.naturalWidth > 0) showLogo();
      else useFallback();
    }
  });
}

function render(){
  const categories = visibleCategories();
  const renderer = state.view === 'landscape' ? renderLandscapeCategory : renderFlatCategory;
  const categoryMarkup = categories.length
    ? categories.map(item => renderer(item.category, item.index)).join('')
    : '<div class="empty">当前没有正在招聘的企业。</div>';
  root.innerHTML = renderFeaturedSection() + categoryMarkup;
  hydrateLogos();
}
root.addEventListener('click', event => {
  const button = event.target.closest('[data-expand]');
  if (!button) return;
  state.expanded.add(button.dataset.expand);
  render();
});
render();
syncRecruitmentSource();
</script>
