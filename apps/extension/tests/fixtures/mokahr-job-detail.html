    <script>
      globalThis.__offerflowListeners = [];
      globalThis.chrome = {
        runtime: {
          getURL: (value) => value,
          onMessage: { addListener: (listener) => globalThis.__offerflowListeners.push(listener) },
          sendMessage: () => Promise.resolve()
        }
      };

    <script src="../../public/extraction-rules.js"></script>
    <script>
      const rules = globalThis.OfferFlowExtractionRules;
      globalThis.OfferFlowExtractionRules = {
        ...rules,
        getAdapter: () => rules.platformAdapters.find((adapter) => adapter.id === "mokahr")
      };
    </script>
    <script src="../../public/content.js"></script>
    <script>
      (() => {
        let captured;
        const done = (value) => {
          captured = value;
          document.body.setAttribute("data-result", encodeURIComponent(JSON.stringify(value)).replaceAll("&", "&amp;"));
        };
        for (const listener of globalThis.__offerflowListeners) listener({ type: "OFFERFLOW_EXTRACT_PAGE" }, null, done);
        if (!captured) done({ ok: false, error: "no listener responded" });
      })();
