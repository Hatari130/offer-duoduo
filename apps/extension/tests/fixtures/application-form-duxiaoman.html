<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>编辑简历 - 得物2027校园招聘</title>
    <style>
      body { margin: 0; padding: 28px; font: 16px/1.5 Arial, sans-serif; }
      .applyFormModuleWrapper__fixture { display: grid; grid-template-columns: 150px 1fr; gap: 20px; margin-bottom: 24px; }
      .applyFormModuleWrapper-right { display: grid; gap: 14px; }
      .education-card, .experience-card, .project-card { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; border: 1px solid #ddd; }
      .ud-formily-item { display: grid; gap: 6px; }
      .ud__native-input, .ud__select__selector { box-sizing: border-box; width: 100%; min-height: 40px; border: 1px solid #bbb; background: white; }
      .ud__select__selector { padding: 9px 12px; }
      .ud__select__dropdown { position: fixed; z-index: 50; width: 280px; padding: 4px; background: white; border: 1px solid #bbb; }
      .ud__select__list__item { padding: 8px 10px; }
      .throne-biz-date-range-picker-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
  </head>
  <body>
    <section class="applyFormModuleWrapper-windows applyFormModuleWrapper__fixture">
      <div class="applyFormModuleWrapper-left">
        <p class="applyFormModuleWrapper-text">基本信息</p>
      </div>
      <div class="applyFormModuleWrapper-right">
        <div id="formily-item-name" class="ud-formily-item">
          <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">姓名</span></div>
          <input class="ud__native-input" data-form-field-id="name" data-form-field-name="name" data-form-field-i18n-name="姓名" />
        </div>
        <div id="formily-item-gender" class="ud-formily-item">
          <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">性别</span></div>
          <div class="ud__select" data-select="gender">
            <div class="ud__select__selector ud__select__selector-readOnly">
              <div class="ud__select__selector__content">
                <div class="ud__select__selector__placeholder">请选择</div>
                <input class="ud__select__selector__search__input ud__native-input" role="combobox" type="search" readonly />
              </div>
            </div>
          </div>
        </div>
        <div id="formily-item-current_city" class="ud-formily-item">
          <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">所在地点</span></div>
          <div class="ud__select" data-select="city">
            <div class="ud__select__selector">
              <div class="ud__select__selector__content">
                <div class="ud__select__selector__placeholder">请选择</div>
                <input class="ud__select__selector__search__input ud__native-input" role="combobox" type="search" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="education-module" class="applyFormModuleWrapper-windows applyFormModuleWrapper__fixture">
      <div class="applyFormModuleWrapper-left">
        <p class="applyFormModuleWrapper-text">教育经历</p>
      </div>
      <div class="applyFormModuleWrapper-right">
        <div class="formily-depth"><div class="formily-depth"><div class="formily-depth"><div class="formily-depth"><div class="formily-depth">
          <div class="formily-depth"><div class="formily-depth"><div class="formily-depth"><div class="formily-depth"><div class="formily-depth">
            <div id="education-cards"></div>
          </div></div></div></div></div>
        </div></div></div></div></div>
        <div class="apply-form-array-card-operate__fixture"><button id="add-education" type="button">添加</button></div>
      </div>
    </section>

    <section id="experience-module" class="applyFormModuleWrapper-windows applyFormModuleWrapper__fixture">
      <div class="applyFormModuleWrapper-left">
        <p class="applyFormModuleWrapper-text">实习经历</p>
      </div>
      <div class="applyFormModuleWrapper-right">
        <div id="experience-cards">
          <article class="apply-form-array-card__fixture experience-card">
          <div class="ud-formily-item">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">公司名称</span></div>
            <input class="ud__native-input" data-form-field-id="company_name" data-form-field-name="company_name" />
          </div>
          <div class="ud-formily-item">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">职位名称</span></div>
            <input class="ud__native-input" data-form-field-id="job_title" data-form-field-name="job_title" />
          </div>
          <div id="formily-item-start_end_time" class="ud-formily-item" data-form-field-name="start_end_time">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">起止时间</span></div>
            <div class="throne-biz-date-range-picker-wrapper" data-form-field-name="time_period">
              <div class="throne-biz-date-range-picker-input"><input class="ud__native-input" type="month" /></div>
              <div class="throne-biz-date-range-picker-input"><input class="ud__native-input" type="month" /></div>
              <label><input type="checkbox" data-current-date /> 至今</label>
            </div>
          </div>
          <div class="ud-formily-item">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">工作描述</span></div>
            <textarea class="ud__native-input" data-form-field-id="work_description" data-form-field-name="work_description"></textarea>
          </div>
          </article>
        </div>
        <div class="apply-form-array-card-operate__fixture"><button id="add-experience" type="button">添加</button></div>
      </div>
    </section>

    <section id="project-module" class="applyFormModuleWrapper-windows applyFormModuleWrapper__fixture">
      <div class="applyFormModuleWrapper-left">
        <p class="applyFormModuleWrapper-text">项目经历</p>
      </div>
      <div class="applyFormModuleWrapper-right">
        <article class="apply-form-array-card__fixture project-card">
          <div class="ud-formily-item">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">项目名称</span></div>
            <input class="ud__native-input" data-form-field-id="project_name" data-form-field-name="project_name" />
          </div>
          <div class="ud-formily-item">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">项目角色</span></div>
            <input class="ud__native-input" data-form-field-id="project_role" data-form-field-name="project_role" />
          </div>
          <div id="formily-item-project-time-period" class="ud-formily-item">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">起止时间</span></div>
            <div class="throne-biz-date-range-picker-wrapper" data-form-field-name="time_period">
              <div class="throne-biz-date-range-picker-input"><input class="ud__native-input" type="month" /></div>
              <div class="throne-biz-date-range-picker-input"><input class="ud__native-input" type="month" /></div>
              <label><input type="checkbox" data-current-date /> 至今</label>
            </div>
          </div>
          <div class="ud-formily-item">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">项目描述</span></div>
            <textarea class="ud__native-input" data-form-field-id="project_description" data-form-field-name="project_description"></textarea>
          </div>
        </article>
      </div>
    </section>

    <div id="select-popups"></div>

    <script>
      globalThis.__offerflowListeners = [];
      globalThis.chrome = {
        storage: { local: { get: async () => ({}) } },
        runtime: {
          getURL: (value) => value,
          onMessage: { addListener: (listener) => globalThis.__offerflowListeners.push(listener) },
          sendMessage: () => Promise.resolve()
        }
      };

      const selectOptions = {
        gender: [
          { text: "男", value: "1" },
          { text: "女", value: "2" },
          { text: "保密", value: "0" }
        ],
        city: ["北京", "上海", "南京"],
        degree: ["本科", "硕士", "博士"],
        school: ["南京大学", "北京林业大学", "同济大学", "南京林业大学"]
      };
      const bindSelect = (root) => {
        if (root.dataset.bound === "true") return;
        root.dataset.bound = "true";
        const kind = root.dataset.select;
        const selector = root.querySelector(".ud__select__selector");
        const input = root.querySelector("input[role='combobox']");
        const popup = document.createElement("div");
        popup.className = "ud__select__dropdown";
        popup.style.display = "none";
        popup.innerHTML = `<div class="ud__select__list"></div>`;
        document.getElementById("select-popups").appendChild(popup);
        const renderOptions = (options) => {
          const list = popup.querySelector(".ud__select__list");
          list.innerHTML = options.map((option) => {
            const text = typeof option === "string" ? option : option.text;
            const dataValue = typeof option === "string" ? option : option.value;
            return `<div class="ud__select__list__item" data-value="${dataValue}"><div class="ud__select__list__item__content"><span>${text}</span></div></div>`;
          }).join("");
          list.querySelectorAll(".ud__select__list__item").forEach((option) => {
            const content = option.querySelector(".ud__select__list__item__content");
            content.addEventListener("mousedown", () => {
              option.dataset.pointerReady = "true";
            });
            option.addEventListener("click", (event) => {
              if (!event.target.closest(".ud__select__list__item__content") || option.dataset.pointerReady !== "true") return;
              delete option.dataset.pointerReady;
              root.querySelector(".ud__select__selector__placeholder")?.remove();
              let selected = root.querySelector(".ud__select__selector__selectItem");
              if (!selected) {
                selected = document.createElement("div");
                selected.className = "ud__select__selector__selectItem";
                selector.querySelector(".ud__select__selector__content").prepend(selected);
              }
              selected.textContent = option.textContent.trim();
              input.value = "";
              selector.classList.remove("ud__select__selector-open");
              selector.classList.add("ud__select__selector-not-empty");
              popup.style.display = "none";
            });
          });
        };
        if (root.dataset.remote !== "true") renderOptions(selectOptions[kind]);
        selector.addEventListener("click", () => {
          document.querySelectorAll(".ud__select__dropdown").forEach((item) => { item.style.display = "none"; });
          selector.classList.add("ud__select__selector-open");
          popup.style.display = "block";
        });
        let searchTimer;
        input.addEventListener("input", () => {
          if (root.dataset.remote !== "true") return;
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            const keyword = input.value.trim();
            renderOptions(selectOptions[kind].filter((option) => option.includes(keyword)));
          }, 180);
        });
      };

      let dateRangeSequence = 0;
      const bindDateRange = (root) => {
        const dateInputs = root.querySelectorAll("input:not([type='checkbox'])");
        const current = root.querySelector("[data-current-date]");
        const props = {
          "data-form-field-id": "time_period",
          "data-form-field-name": "time_period",
          value: [undefined, undefined],
          onChange: (range) => {
            props.value = range;
            dateInputs[0].value = typeof range[0] === "object"
              ? `${range[0].year}-${range[0].month}`
              : range[0] || "";
            dateInputs[1].value = typeof range[1] === "object"
              ? `${range[1].year}-${range[1].month}`
              : range[1] || "";
          }
        };
        dateInputs[0][`__reactInternalInstance$fixtureDate${dateRangeSequence++}`] = {
          memoizedProps: {},
          return: { memoizedProps: {}, return: { memoizedProps: props, return: null } }
        };
        current?.addEventListener("change", () => {
          if (current.checked) dateInputs[1].value = "";
        });
      };

      const educationCards = document.getElementById("education-cards");
      const experienceCards = document.getElementById("experience-cards");
      let educationAdds = 0;
      let experienceAdds = 0;
      const addEducationCard = () => {
        const index = educationCards.children.length;
        const card = document.createElement("article");
        card.className = "apply-form-array-card__fixture education-card";
        card.innerHTML = `
          <div id="formily-item-school" class="ud-formily-item" data-form-field-name="school">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">学校名称</span></div>
            <div class="ud__select" data-select="school" data-remote="true">
              <div class="ud__select__selector">
                <div class="ud__select__selector__content">
                  <div class="ud__select__selector__placeholder">请输入学校名称</div>
                  <input class="ud__select__selector__search__input ud__native-input" role="combobox" type="search" data-form-field-id="school" data-form-field-name="school" data-form-field-i18n-name="学校名称" />
                </div>
              </div>
            </div>
          </div>
          <div id="formily-item-degree" class="ud-formily-item" data-form-field-name="degree">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">学历</span></div>
            <div class="ud__select" data-select="degree">
              <div class="ud__select__selector ud__select__selector-readOnly">
                <div class="ud__select__selector__content">
                  <div class="ud__select__selector__placeholder">请选择</div>
                  <input class="ud__select__selector__search__input ud__native-input" role="combobox" type="search" readonly />
                </div>
              </div>
            </div>
          </div>
          <div id="formily-item-field_of_study" class="ud-formily-item" data-form-field-name="field_of_study">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">专业</span></div>
            <input class="ud__native-input" data-form-field-id="field_of_study" data-form-field-name="field_of_study" data-form-field-i18n-name="专业" />
          </div>
          <div id="formily-item-start_end_time" class="ud-formily-item" data-form-field-name="start_end_time">
            <div class="ud-formily-item-label"><span class="ud-formily-item-label-content">起止时间</span></div>
            <div class="throne-biz-date-range-picker-wrapper">
              <div class="throne-biz-date-range-picker-input"><input class="ud__native-input" type="month" /></div>
              <div class="throne-biz-date-range-picker-input"><input class="ud__native-input" type="month" /></div>
            </div>
          </div>`;
        educationCards.appendChild(card);
        card.querySelectorAll(".ud__select").forEach(bindSelect);
        bindDateRange(card.querySelector(".throne-biz-date-range-picker-wrapper"));
      };
      addEducationCard();
      bindDateRange(document.querySelector("#experience-module .throne-biz-date-range-picker-wrapper"));
      bindDateRange(document.querySelector("#project-module .throne-biz-date-range-picker-wrapper"));
      document.querySelectorAll(".ud__select").forEach(bindSelect);
      document.getElementById("add-education").addEventListener("click", () => {
        educationAdds += 1;
        addEducationCard();
      });
      document.getElementById("add-experience").addEventListener("click", () => {
        experienceAdds += 1;
        const card = experienceCards.firstElementChild.cloneNode(true);
        card.querySelectorAll("input,textarea").forEach((control) => {
          if (control.type === "checkbox") control.checked = false;
          else control.value = "";
        });
        experienceCards.appendChild(card);
        bindDateRange(card.querySelector(".throne-biz-date-range-picker-wrapper"));
      });
    </script>
    <script src="../../public/adapter-registry.js"></script>
    <script src="../../public/extraction-rules.js"></script>
    <script src="../../public/form-adapters.js"></script>
    <script src="../../public/form-runtime.js"></script>
    <script src="../../public/form-control-drivers.js"></script>
    <script src="../../public/content.js"></script>
    <script>
      const listener = globalThis.__offerflowListeners.at(-1);
      const repeatCounts = { education: 3, experience: 2, project: 1 };
      listener(
        { type: "OFFERFLOW_SCAN_APPLICATION_FORM_V2", expandRepeaters: false, repeatCounts },
        {},
        (scan) => {
          const addsAfterScan = { education: educationAdds, experience: experienceAdds };
          const snapshots = [
            {
              fullName: "林知夏", gender: "女", currentCity: "南京",
              school: "南京大学", degree: "硕士", major: "城乡规划",
              educationStartDate: "2024-09", educationEndDate: "2027-06",
              experienceOrganization: "携程集团", experienceTitle: "AI产品经理",
              experienceStartDate: "2026-04", experienceEndDate: "至今",
              experienceDescription: "负责 AI 产品对话体验与增长闭环",
              projectName: "Agents APP", projectRole: "产品负责人",
              projectStartDate: "2025-09", projectEndDate: "至今",
              projectDescription: "搭建智能体工作流并优化多轮引导策略"
            },
            {
              school: "北京林业大学", degree: "本科", major: "城乡规划",
              educationStartDate: "2018-09", educationEndDate: "2023-06",
              experienceOrganization: "南京开为网络科技有限公司", experienceTitle: "产品部门 AI产品经理",
              experienceStartDate: "2025-11", experienceEndDate: "2026-03",
              experienceDescription: "负责 Agnes APP 对话体验与留存增长"
            },
            {
              school: "同济大学", degree: "本科", major: "城市规划",
              educationStartDate: "2014-09", educationEndDate: "2018-06"
            }
          ];
          const rangeEndKeys = {
            educationStartDate: "educationEndDate",
            experienceStartDate: "experienceEndDate",
            projectStartDate: "projectEndDate"
          };
          const fieldValues = Object.fromEntries(scan.fields.map((field) => [
            field.id,
            field.type === "date-range"
              ? `${snapshots[0][field.key]}\u001f${snapshots[0][rangeEndKeys[field.key]]}`
              : snapshots[0][field.key] || ""
          ]));
          listener(
            {
              type: "OFFERFLOW_FILL_APPLICATION_FORM_V2",
              fields: scan.fields,
              fieldValues,
              profileSnapshots: snapshots,
              repeatCounts,
              repeatPlan: {},
              fillDynamicFields: true,
              maxRounds: 5,
              delayMs: 0
            },
            {},
            (fill) => {
              const addsAfterFirstFill = { education: educationAdds, experience: experienceAdds };
              listener(
                {
                  type: "OFFERFLOW_FILL_APPLICATION_FORM_V2",
                  fields: [],
                  fieldValues: {},
                  profileSnapshots: snapshots,
                  repeatCounts,
                  repeatPlan: {},
                  fillDynamicFields: false,
                  maxRounds: 1,
                  delayMs: 0
                },
                {},
                (secondFill) => {
                  const education = Array.from(document.querySelectorAll("#education-cards .education-card")).map((card) => ({
                    school: card.querySelector("[data-select='school'] .ud__select__selector__selectItem")?.textContent.trim() || "",
                    degree: card.querySelector("[data-select='degree'] .ud__select__selector__selectItem")?.textContent.trim() || "",
                    major: card.querySelector("input[data-form-field-name='field_of_study']").value,
                    dates: Array.from(card.querySelectorAll(".throne-biz-date-range-picker-wrapper input")).map((input) => input.value)
                  }));
                  const experience = Array.from(document.querySelectorAll(".experience-card")).map((experienceCard) => ({
                    company: experienceCard.querySelector("[data-form-field-name='company_name']").value,
                    title: experienceCard.querySelector("[data-form-field-name='job_title']").value,
                    dates: Array.from(experienceCard.querySelectorAll(".throne-biz-date-range-picker-wrapper input:not([type='checkbox'])")).map((input) => input.value),
                    current: experienceCard.querySelector("[data-current-date]").checked,
                    description: experienceCard.querySelector("[data-form-field-name='work_description']").value
                  }));
                  const projectCard = document.querySelector(".project-card");
                  const project = {
                    name: projectCard.querySelector("[data-form-field-name='project_name']").value,
                    role: projectCard.querySelector("[data-form-field-name='project_role']").value,
                    dates: Array.from(projectCard.querySelectorAll(".throne-biz-date-range-picker-wrapper input:not([type='checkbox'])")).map((input) => input.value),
                    current: projectCard.querySelector("[data-current-date]").checked,
                    description: projectCard.querySelector("[data-form-field-name='project_description']").value
                  };
                  document.body.dataset.ready = "true";
                  document.body.dataset.result = encodeURIComponent(JSON.stringify({
                    ok: true,
                    data: {
                      scan,
                      fill,
                      secondFill,
                      addsAfterScan,
                      addsAfterFirstFill,
                      educationAdds,
                      experienceAdds,
                      name: document.querySelector("[data-form-field-name='name']").value,
                      gender: document.querySelector("[data-select='gender'] .ud__select__selector__selectItem")?.textContent.trim() || "",
                      city: document.querySelector("[data-select='city'] .ud__select__selector__selectItem")?.textContent.trim() || "",
                      education,
                      experience,
                      project,
                      dewuAdapter: window.OfferFlowFormAdapters.resolve({ hostname: "campus.dewu.com", pathname: "/578078/resume/example/apply" }).id,
                      openDropdowns: Array.from(document.querySelectorAll(".ud__select__dropdown")).filter((item) => getComputedStyle(item).display !== "none").length
                    }
                  }));
                }
              );
            }
          );
        }
      );
    </script>
  </body>
</html>
