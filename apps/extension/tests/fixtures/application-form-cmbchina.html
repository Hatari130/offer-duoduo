      .ant-form-item { margin-bottom: 24px; display: flex; align-items: center; }
      .ant-form-item-label { width: 140px; text-align: right; margin-right: 16px; }
      .ant-form-item-control { flex: 1; }
      .ant-input { box-sizing: border-box; width: 100%; max-width: 360px; height: 36px; padding: 4px 11px; border: 1px solid #d9d9d9; border-radius: 2px; }
      .ant-select { position: relative; width: 100%; max-width: 360px; }
      .ant-select-selector { box-sizing: border-box; min-height: 36px; padding: 4px 11px; border: 1px solid #d9d9d9; border-radius: 2px; }
      .ant-select-selection-search-input { position: absolute; inset: 0; width: 100%; opacity: 0; }
      .ant-select-dropdown { position: absolute; z-index: 1050; min-width: 200px; background: #fff; box-shadow: 0 3px 6px -4px rgba(0,0,0,.12), 0 6px 16px 0 rgba(0,0,0,.08); border-radius: 2px; padding: 4px 0; }
      .ant-select-dropdown-hidden { display: none; }
      .ant-select-item-option { padding: 5px 12px; cursor: pointer; }
      .ant-select-item-option:hover { background: #f5f5f5; }
      .ant-picker { box-sizing: border-box; padding: 4px 11px; height: 36px; border: 1px solid #d9d9d9; border-radius: 2px; display: inline-flex; align-items: center; }
      .ant-picker-input > input { border: none; outline: none; width: 100%; }
      .ant-radio-group { display: inline-flex; gap: 16px; }
      .ant-radio-wrapper { display: inline-flex; align-items: center; cursor: pointer; gap: 8px; }
    </style>

    <script>
      globalThis.__offerflowListeners = [];
      globalThis.chrome = {
        storage: { local: { get: async () => ({}) } },
        runtime: {
          getURL: (value) => value,
          onMessage: { addListener: (listener) => globalThis.__offerflowListeners.push(listener) },
          sendMessage: (msg) => {
            if (msg?.type === "OFFERFLOW_FILL_PROGRESS") {
              const p = msg.progress || msg;
              document.body.dataset.fillProgress = `${p.stage}:${p.current}/${p.total}:${p.label || ""}`;
            }
            return Promise.resolve();
          }
        }
      };

      let activeSelect = null;
      function wireAntSelect(root) {
        const selector = root.querySelector(".ant-select-selector");
        const input = root.querySelector("input[role='combobox']");
        const listId = input?.getAttribute("aria-controls");
        const list = listId ? document.getElementById(listId) : null;
        const dropdown = list?.closest(".ant-select-dropdown");
        if (!dropdown || !selector || !input) return;

        const close = () => {
          if (activeSelect === root) {
            activeSelect = null;
          }
          root.classList.remove("ant-select-open");
          input.setAttribute("aria-expanded", "false");
          dropdown.classList.add("ant-select-dropdown-hidden");
        };

        selector.addEventListener("click", (e) => {
          e.stopPropagation();
          if (activeSelect && activeSelect !== root) {
            activeSelect.classList.remove("ant-select-open");
            activeSelect.querySelector("input[role='combobox']")?.setAttribute("aria-expanded", "false");
          }
          activeSelect = root;
          root.classList.add("ant-select-open");
          input.setAttribute("aria-expanded", "true");
          dropdown.classList.remove("ant-select-dropdown-hidden");
        });

        dropdown.querySelectorAll(".ant-select-item-option").forEach((option) => {
          option.addEventListener("click", (e) => {
            e.stopPropagation();
            const targetRoot = activeSelect || root;
            const targetInput = targetRoot.querySelector("input[role='combobox']");
            const targetSelector = targetRoot.querySelector(".ant-select-selector");
            targetRoot.querySelector(".ant-select-selection-placeholder")?.remove();
            let selected = targetRoot.querySelector(".ant-select-selection-item");
            if (!selected) {
              selected = document.createElement("span");
              selected.className = "ant-select-selection-item";
              targetSelector.appendChild(selected);
            }
            selected.textContent = option.textContent.trim();
            selected.setAttribute("title", option.textContent.trim());
            if (targetInput) {
              targetInput.value = option.textContent.trim();
              targetInput.dispatchEvent(new Event("input", { bubbles: true }));
              targetInput.dispatchEvent(new Event("change", { bubbles: true }));
            }
            close();
          });
        });

        document.addEventListener("click", (e) => {
          if (activeSelect === root && !root.contains(e.target) && !dropdown.contains(e.target)) {
            close();
          }
        });
      }
      document.querySelectorAll(".ant-select").forEach(wireAntSelect);

      function wireAntRadio(group) {
        const wrappers = group.querySelectorAll(".ant-radio-wrapper");
        wrappers.forEach((wrapper) => {
          wrapper.addEventListener("click", () => {
            wrappers.forEach((w) => {
              w.classList.remove("ant-radio-wrapper-checked");
              const r = w.querySelector(".ant-radio");
              r?.classList.remove("ant-radio-checked");
              const inp = w.querySelector("input[type='radio']");
              if (inp) inp.checked = false;
            });
            wrapper.classList.add("ant-radio-wrapper-checked");
            const radio = wrapper.querySelector(".ant-radio");
            radio?.classList.add("ant-radio-checked");
            const inp = wrapper.querySelector("input[type='radio']");
            if (inp) {
              inp.checked = true;
              inp.dispatchEvent(new Event("change", { bubbles: true }));
            }
          });
        });
      }
      document.querySelectorAll(".ant-radio-group").forEach(wireAntRadio);
