<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <style>

      header nav a { color: #fff; margin-right: 18px; text-decoration: none; }

      .delivery-list-item { padding: 18px 20px; border: 1px solid #ececec; border-radius: 8px; margin: 14px 0 12px; }
      .delivery-list-job_name { font-size: 18px; font-weight: 600; }
      .delivery-list-status { margin: 8px 0 4px; color: #1769e0; }
      .delivery-list-type, .delivery-list-time { color: #888; font-size: 13px; }

  <body>

      </div>

          <div class="delivery-list-time">2026.08.08 19:03 投递</div>
          <button>编辑</button>
        </div>
        <div class="delivery-list-item">
          <div class="delivery-list-job_name">27届校招-AI产品经理（J14379）</div>
          <div class="delivery-list-status">当前进度：简历筛选·初筛进行中</div>
          <div class="delivery-list-type">校园招聘</div>
          <div class="delivery-list-time">2026.08.08 19:02 投递</div>

    </main>
    <footer class="footer-code">
      /*project config start*/
      /*project config end*/
    </footer>
    <script type="text/javascript">
      /*project config start*/
      /*project config end*/
    </script>
    <script>
      globalThis.__offerflowListeners = [];
      globalThis.chrome = {
        runtime: {
          getURL: (value) => value,
          onMessage: { addListener: (listener) => globalThis.__offerflowListeners.push(listener) },
          sendMessage: () => Promise.resolve()
        }
      };
    </script>
    <script src="../../public/extraction-rules.js"></script>
    <script>
      // The fixture runs from a file:// URL, so the hostname is empty. Route the
      // adapter lookup through the real zhiye.com adapter to exercise the
      // delivery-record selectors and single-status extraction path.
      const offerFlowRules = globalThis.OfferFlowExtractionRules;
      const offerFlowGetAdapter = offerFlowRules.getAdapter;
      globalThis.OfferFlowExtractionRules = {
        ...offerFlowRules,
        getAdapter: (hostname) =>
          offerFlowGetAdapter(String(hostname || "").toLowerCase() === "" ? "intsig.zhiye.com" : hostname)
      };
    </script>
    <script src="../../public/content.js"></script>
    <script>
      (() => {
        let captured;
        const done = (value) => {
          captured = value;
          document.body.setAttribute(
            "data-result",
            encodeURIComponent(JSON.stringify(value)).replaceAll("&", "&amp;")
          );
        };
        for (const listener of globalThis.__offerflowListeners) {
          listener({ type: "OFFERFLOW_EXTRACT_PAGE" }, null, done);
        }
        if (!captured) done({ ok: false, error: "no listener responded" });
      })();
    </script>
  </body>
</html>
